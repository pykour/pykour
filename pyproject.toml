[project]
name = "pykour"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Takashi Yamashina", email = "takashi.yamashina@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "orjson>=3.11.5",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30.0",
]

[project.scripts]
pykour = "pykour.cli.main:main"

[dependency-groups]
dev = [
    "aiofiles>=24.1.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.30.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.11",
    "ty>=0.0.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"
